services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    

  backend:
      build:
        context: ../backend
        target: production       # l'étape finale du multi-stage
      environment:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        JWT_SECRET: ${JWT_SECRET}
        REDIS_URL: redis://redis:6379

      ports:
        - "3000:3000"

      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      restart: unless-stopped

  # Outil ponctuel : charge les données de démo.
  # Utilise l'étape "build" du MÊME Dockerfile (deps complètes : tsx + prisma CLI),
  # car l'image de production n'a pas d'outils de dev — c'est voulu.
  # Usage : docker compose --profile tools run --rm seed npm run seed
  seed:
      build:
        context: ../backend
        target: build
      environment:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      depends_on:
        postgres:
          condition: service_healthy
      profiles: ["tools"]

  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
    postgres_data:
