# Stack locale — Phase 0
# - Postgres (volontairement limité au réseau Docker : hôte → port 5433 pour éviter le conflit
#   avec le Postgres local déjà installé)
# - Backend (build du Dockerfile backend)
# - Adminer : explorateur BdD sur http://localhost:8080
# - Kafka (bitnami, KRaft single-node) : activé avec `docker compose --profile events up`
#   pour la future architecture événementielle
name: match-de-quartier

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foot
      POSTGRES_PASSWORD: localpwd
      POSTGRES_DB: foot_matchmaking
    ports:
      - "5433:5432"           # hôte 5433 → réseau 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foot -d foot_matchmaking"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://foot:localpwd@postgres:5432/foot_matchmaking
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # ── À ACTIVER pour l'axe DevOps (events) ───────────────────────
  # usage : docker compose --profile events up
  kafka:
    image: bitnami/kafka:3.7
    profiles: [events]
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"

volumes:
  pgdata:
